name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  local-release-gates:
    name: Local Release Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install admin dependencies
        run: npm ci
        working-directory: frontend/admin

      - name: Install customer app dependencies
        run: npm ci
        working-directory: frontend/user-app

      - name: Install driver app dependencies
        run: npm ci
        working-directory: frontend/driver-app

      - name: Run local release gates
        run: npm run verify:local

  # ─── Backend: Lint, Test, Build ─────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output exists
        run: test -f dist/server.js

  # ─── Admin Panel: Build ─────────────────────────────────────
  admin-build:
    name: Admin Panel Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ─── Docker Build (on main only) ───────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, backend-build]
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t jaheez-backend:${{ github.sha }} .

      - name: Verify image health
        run: |
          docker run -d --name test-backend \
            -e NODE_ENV=production \
            -e PORT=3002 \
            -e SUPABASE_URL=https://placeholder.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=placeholder-key-for-ci \
            -e SUPABASE_ANON_KEY=placeholder-anon-key \
            -e ADMIN_JWT_SECRET=ci-test-secret-minimum-16 \
            -p 3002:3002 \
            jaheez-backend:${{ github.sha }}
          sleep 5
          docker logs test-backend
          docker stop test-backend
